name: Release

# Version-Tag pushen, um ein Release zu veröffentlichen, z. B.:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags mit Bindestrich (z. B. v1.0.0-rc1) werden als Pre-Release markiert.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Shellcheck
        run: shellcheck install.sh build.sh release.sh

      - name: Build zip
        run: ./build.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/buy-or-wait.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
