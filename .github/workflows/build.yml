name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is only available up to Ubuntu 24.04
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Check Python 3.9 syntax
        run: |
          for f in buy-or-wait/scripts/*.py; do
            python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read(), feature_version=(3,9))" "$f"
          done

      - name: Shellcheck
        run: shellcheck install.sh build.sh release.sh

      - name: Check analyze.py
        run: python3 buy-or-wait/scripts/analyze.py --help >/dev/null

      - name: Test install.sh
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/skills"
          ./install.sh --target "$target"
          test -f "$target/buy-or-wait/SKILL.md"
          test -x "$target/buy-or-wait/scripts/analyze.py"
          test ! -e "$target/buy-or-wait/evals"
          test -f "$target/buy-or-wait/LICENSE"
          test -f "$target/buy-or-wait/NOTICE"
          ./install.sh --target "$target"            # again: overwrites cleanly
          ./install.sh --target "$target" --uninstall
          test ! -e "$target/buy-or-wait"
          ./install.sh --target "$target" --uninstall # idempotent

      - name: Smoke test against Yahoo Finance
        continue-on-error: true  # external API – must not block the build
        run: |
          python3 buy-or-wait/scripts/analyze.py NVDA --as-of 2024-06-18 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['pre_assessment']['verdict']; print(v); sys.exit(v != \"DON'T BUY\")"

  package:
    name: Package skill
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build zip
        run: ./build.sh

      - name: Check zip contents
        run: |
          set -euo pipefail
          unzip -l dist/buy-or-wait.zip
          unzip -Z1 dist/buy-or-wait.zip > "$RUNNER_TEMP/files"
          grep -qx 'buy-or-wait/SKILL.md' "$RUNNER_TEMP/files"
          grep -qx 'buy-or-wait/LICENSE' "$RUNNER_TEMP/files"
          grep -qx 'buy-or-wait/NOTICE' "$RUNNER_TEMP/files"
          if grep -q '/evals/' "$RUNNER_TEMP/files"; then echo 'evals/ in zip' >&2; exit 1; fi

      # archive: false uploads the file directly instead of wrapping it in a
      # second zip; the artifact is then named like the file (buy-or-wait.zip)
      # and can be imported directly as a skill.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/buy-or-wait.zip
          archive: false
          if-no-files-found: error
